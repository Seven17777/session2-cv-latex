name: Build LaTeX CV
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Compile English CV with full TeX Live
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: '2025'
          latexmk_use_xelatex: true
      - uses: actions/upload-artifact@v4
        with:
          name: latex-cv-pdf
          path: main.pdf
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: latex-cv-pdf
          path: pdf
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          TAG: cv-${{ github.run_number }}-${{ github.run_attempt }}
        run: gh release create "$TAG" pdf/main.pdf --target "$COMMIT" --title "$TAG" --notes "English LaTeX CV compiled with XeLaTeX by GitHub Actions."
